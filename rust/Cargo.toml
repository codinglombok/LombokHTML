[package]
name = "lombokhtml"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Zero-dependency HTML ingestion: error-tolerant HTML5-subset parser, DOM tree, tag stripping, sanitizer, CSS selector query, meta/table extraction."
keywords = ["html","parser","sanitizer","dom","no-std"]
categories = ["parser-implementations","no-std","web-programming"]
rust-version = "1.75"
repository = "https://github.com/codinglombok/LombokHTML"

[lib]
name = "lombokhtml"
path = "src/lib.rs"

[features]
default = ["std"]
std = []

# Test-only (not linked into the library): reads the cross-language vectors.
[dev-dependencies]
serde_json = "1"
