# Salin ke <Repo>/.github/workflows/release.yml  (ganti LombokHTML & lombokhtml)
name: release
on:
  push:
    branches: [main]
jobs:
  lombok-release:
    uses: codinglombok/.github/.github/workflows/lombok-release.yml@main
    with:
      repo_name: LombokHTML
      package_name: lombokhtml
    secrets: inherit
